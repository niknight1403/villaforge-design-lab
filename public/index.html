<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>VillaForge Design Lab</title>
  <style>
    body { background: #050816; color: #00FFD1; font-family: sans-serif; padding: 20px; }
    h1 { color: #FF3DDB; }
    .card { border: 1px solid #00FFD1; padding: 15px; margin: 10px 0; border-radius: 8px; }
    button { background: #00FFD1; color: #050816; border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>
  <div id="loading" style="display: none; color: #FF3DDB; font-weight: bold; margin-bottom: 10px;">Lade Daten...</div>
  <div id="error" style="display: none; color: #ff3333; font-weight: bold; margin-bottom: 10px;"></div>
  <h1>VillaForge Design Lab & Theme-Sync</h1>
  <p>Zentrale Design- und UI-Mockup-Instanz fuer die VillaForge-Familie.</p>
  <div class="card">
    <h3>Multi-Style-Generator & Theme Sync</h3>
    <button onclick="syncTheme('cyber-glass')">Cyber Glass Sync</button>
  </div>
  <div id="result"></div>
  <script>
    function showLoading(show) {
      document.getElementById('loading').style.display = show ? 'block' : 'none';
    }
    function showError(msg) {
      const errDiv = document.getElementById('error');
      if (msg) {
        errDiv.style.display = 'block';
        errDiv.innerText = msg;
      } else {
        errDiv.style.display = 'none';
        errDiv.innerText = '';
      }
    }
    function syncTheme(theme) {
      showLoading(true);
      showError(null);
      fetch('/api/sync', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ theme })
      })
      .then(res => {
        if (!res.ok) throw new Error('Server-Fehler: ' + res.status);
        return res.json();
      })
      .then(data => {
        showLoading(false);
        document.getElementById('result').innerText = JSON.stringify(data, null, 2);
      })
      .catch(err => {
        showLoading(false);
        showError(err.message || 'Unbekannter Fehler aufgetreten');
      });
    }
  </script>
</body>
</html>
